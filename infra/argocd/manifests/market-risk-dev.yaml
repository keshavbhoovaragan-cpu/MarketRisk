apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketrisk-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/marketrisk-infra.git
    targetRevision: HEAD
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: market-risk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
