apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-runner
  namespace: market-risk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-runner
  namespace: market-risk
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-runner
  namespace: market-risk
subjects:
  - kind: ServiceAccount
    name: spark-runner
    namespace: market-risk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-runner
