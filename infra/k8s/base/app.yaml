apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-sqlite-data
  namespace: market-risk
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: market-risk
  labels:
    app.kubernetes.io/name: marketrisk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marketrisk-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketrisk-api
    spec:
      containers:
        - name: api
          image: ghcr.io/keshavbhoovaragan-cpu/marketrisk-api:4d1e566b478fe74544c9f0f7f71e6e6ede4363fa
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: MARKETRISK_DATA_DIR
              value: /app/data
            - name: DB_PATH
              value: /app/data/marketrisk.db
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: api-sqlite-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: market-risk
spec:
  selector:
    app.kubernetes.io/name: marketrisk-api
  ports:
    - name: http
      port: 8002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: market-risk
  labels:
    app.kubernetes.io/name: marketrisk-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marketrisk-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketrisk-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/keshavbhoovaragan-cpu/marketrisk-frontend:4d1e566b478fe74544c9f0f7f71e6e6ede4363fa
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: market-risk
spec:
  selector:
    app.kubernetes.io/name: marketrisk-frontend
  ports:
    - name: http
      port: 3002
      targetPort: http
