name: Build and publish GHCR images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ghcr-build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: keshavbhoovaragan-cpu
  BACKEND_IMAGE: marketrisk-api
  FRONTEND_IMAGE: marketrisk-frontend
  SPARK_IMAGE: marketrisk-spark-job

jobs:
  build-images:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}-${{ matrix.architecture }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.BACKEND_IMAGE }}:latest-${{ matrix.architecture }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}-${{ matrix.architecture }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.FRONTEND_IMAGE }}:latest-${{ matrix.architecture }}

      - name: Build and push Spark job image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/spark_jobs/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.SPARK_IMAGE }}:${{ github.sha }}-${{ matrix.architecture }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.SPARK_IMAGE }}:latest-${{ matrix.architecture }}

  publish-manifests:
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture image tags
        run: |
          for image in "${BACKEND_IMAGE}" "${FRONTEND_IMAGE}" "${SPARK_IMAGE}"; do
            docker buildx imagetools create \
              --tag "${REGISTRY}/${OWNER}/${image}:${GITHUB_SHA}" \
              --tag "${REGISTRY}/${OWNER}/${image}:latest" \
              "${REGISTRY}/${OWNER}/${image}:${GITHUB_SHA}-amd64" \
              "${REGISTRY}/${OWNER}/${image}:${GITHUB_SHA}-arm64"
          done

      - name: Update manifest image tags
        run: |
          python scripts/update-image-tags.py \
            --tag "${{ github.sha }}" \
            --prefix "${{ env.REGISTRY }}/${{ env.OWNER }}" \
            --files infra/k8s/base/app.yaml infra/k8s/dev/spark-application.yaml infra/k8s/dev/scheduled-spark-application.yaml

      - name: Commit manifest tag updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/base/app.yaml infra/k8s/dev/spark-application.yaml infra/k8s/dev/scheduled-spark-application.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update Kubernetes image tags for GHCR"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
